<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3VolutionTurbos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #0a0a0a; color: #fff; font-family: system-ui, sans-serif; padding-bottom: 80px; }
.header { position: sticky; top: 0; z-index: 30; background: rgba(10,10,10,0.95); border-bottom: 1px solid #262626; display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px; }
.header h1 { font-size: 18px; font-weight: 700; }
.header h1 span { color: #e11d2e; font-style: italic; }
.icon-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
main { max-width: 640px; margin: 0 auto; padding: 16px; }
.drawer { position: fixed; top: 0; left: 0; height: 100%; width: 280px; background: #141414; z-index: 50; transform: translateX(-100%); transition: transform 0.25s; display: flex; flex-direction: column; }
.drawer.open { transform: translateX(0); }
.drawer-top { padding: 20px; border-bottom: 1px solid #262626; display: flex; justify-content: space-between; align-items: flex-start; }
.drawer-top h2 { font-size: 16px; }
.drawer nav { padding: 12px; flex: 1; }
.drawer nav a { display: flex; gap: 12px; padding: 14px; border-radius: 8px; cursor: pointer; color: #fff; text-decoration: none; }
.sair { margin: 16px; padding: 12px; background: none; border: none; color: #e11d2e; font-size: 16px; text-align: left; cursor: pointer; border-top: 1px solid #262626; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; display: none; }
.overlay.show { display: block; }
.card { background: #141414; border: 1px solid #262626; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.destaque { background: linear-gradient(135deg, #141414, #000); border-radius: 24px; padding: 20px; margin-bottom: 20px; position: relative; }
.destaque .tag { color: #e11d2e; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
.destaque h2 { font-size: 24px; font-weight: 700; margin: 4px 0; }
.destaque p { color: #9ca3af; font-size: 14px; margin-top: 8px; }
.destaque .icone { position: absolute; top: 20px; right: 20px; font-size: 28px; opacity: 0.7; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.stat { background: #141414; border: 1px solid #262626; border-radius: 16px; padding: 20px; }
.stat .num { font-size: 30px; font-weight: 700; }
.stat .lbl { color: #9ca3af; font-size: 14px; margin-top: 4px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; border-radius: 16px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
.btn-primary { background: #e11d2e; color: #fff; }
.btn-sec { background: #141414; border: 1px solid #262626; color: #fff; }
.btn-pequeno { padding: 8px 12px; font-size: 14px; width: auto; margin-bottom: 0; display: inline-flex; }
h3 { font-size: 20px; font-weight: 700; margin: 20px 0 12px; }
.linha { display: flex; justify-content: space-between; align-items: center; }
.obra { background: #141414; border: 1px solid #262626; border-radius: 16px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
.obra .top { display: flex; justify-content: space-between; align-items: start; }
.obra .num { font-weight: 700; }
.obra .cliente { margin-top: 4px; }
.obra .sub { display: flex; justify-content: space-between; margin-top: 4px; color: #9ca3af; font-size: 14px; }
.badge { font-size: 12px; padding: 4px 12px; border-radius: 999px; font-weight: 500; }
.badge.Recebido { background: rgba(30,64,175,0.6); color: #93c5fd; }
.badge.Emreparacao { background: rgba(133,77,14,0.6); color: #fde047; }
.badge.Pronto { background: rgba(22,101,52,0.6); color: #86efac; }
.badge.Entregue { background: rgba(55,65,81,0.6); color: #d1d5db; }
input, select, textarea { background: #141414; border: 1px solid #262626; color: #fff; border-radius: 8px; padding: 12px; width: 100%; font-size: 16px; font-family: inherit; margin-bottom: 12px; }
label { display: block; color: #9ca3af; font-size: 14px; margin-bottom: 4px; }
.campo-info { margin-bottom: 12px; }
.campo-info .lbl { color: #9ca3af; font-size: 14px; }
.campo-info .val { font-weight: 500; margin-top: 2px; }
.grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.estados { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.estados button { padding: 12px; border-radius: 12px; border: 1px solid #262626; background: rgba(0,0,0,0.4); color: #fff; font-weight: 500; font-size: 14px; cursor: pointer; }
.estados button.ativo { background: #e11d2e; border-color: #e11d2e; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,20,20,0.95); border-top: 1px solid #262626; display: grid; grid-template-columns: 1fr 1fr 1fr; z-index: 30; }
.bottom-nav button { background: none; border: none; color: #9ca3af; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; }
.bottom-nav button.ativo { color: #e11d2e; }
.muted { color: #9ca3af; }
.small { font-size: 12px; }
.voltar { background: none; border: 1px solid #262626; color: #fff; padding: 8px 12px; border-radius: 12px; cursor: pointer; font-size: 18px; }
.cabecalho-obra { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.cabecalho-obra .tag { color: #e11d2e; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
.cabecalho-obra .num { font-size: 24px; font-weight: 700; }
.login { max-width: 400px; margin: 60px auto; padding: 24px; }
.login h1 { text-align: center; font-size: 28px; margin-bottom: 8px; }
.login h1 span { color: #e11d2e; font-style: italic; }
.fotos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.foto-item { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; border: 1px solid #262626; }
.foto-item img { width: 100%; height: 100%; object-fit: cover; }
.foto-item .remover { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.7); border: none; color: #fff; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1; }
.foto-add { aspect-ratio: 1; border: 2px dashed #262626; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: #9ca3af; font-size: 12px; gap: 4px; background: rgba(0,0,0,0.3); }
.foto-input { display: none; }
.sub-titulo { color: #9ca3af; font-size: 13px; font-weight: 600; margin-top: 16px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
.cliente-card { background: #141414; border: 1px solid #262626; border-radius: 16px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
.autocomplete { position: relative; }
.autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: #1a1a1a; border: 1px solid #262626; border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 100; display: none; }
.autocomplete-list.show { display: block; }
.autocomplete-list div { padding: 12px; cursor: pointer; border-bottom: 1px solid #262626; }
.loading { text-align: center; padding: 40px; color: #9ca3af; }
</style>
</head>
<body>

<div id="app">
  <header class="header" style="display:none">
    <button onclick="toggleDrawer()" class="icon-btn">☰</button>
    <h1>3Volution<span>Turbos</span></h1>
    <button onclick="sair()" class="icon-btn">⏻</button>
  </header>

  <aside id="drawer" class="drawer">
    <div class="drawer-top">
      <div>
        <h2>3VolutionTurbos</h2>
        <p class="muted small" id="drawer-email">...</p>
      </div>
      <button onclick="toggleDrawer()" class="icon-btn">✕</button>
    </div>
    <nav>
      <a onclick="nav('inicio')">📋 Início</a>
      <a onclick="nav('nova')">➕ Nova obra</a>
      <a onclick="nav('pesquisar')">🔍 Pesquisar</a>
      <a onclick="nav('clientes-lista')">👤 Clientes</a>
      <a onclick="nav('clientes')">👥 Clientes / Obras</a>
      <a onclick="nav('definicoes')">⚙️ Definições</a>
    </nav>
    <button onclick="sair()" class="sair">⏻ Sair</button>
  </aside>
  <div id="overlay" class="overlay" onclick="toggleDrawer()"></div>

  <main id="main"><div class="loading">A carregar...</div></main>

  <nav class="bottom-nav" style="display:none">
    <button onclick="nav('inicio')" id="bn-inicio">📋<span>Início</span></button>
    <button onclick="nav('nova')" id="bn-nova">➕<span>Nova obra</span></button>
    <button onclick="nav('pesquisar')" id="bn-pesquisar">🔍<span>Pesquisar</span></button>
  </nav>
</div>

<script>
// ============================================
// CONFIGURAÇÃO — SUBSTITUI ESTES 2 VALORES!
// ============================================
var SUPABASE_URL = 'https://orkaetadyzbhbawrosf.supabase.com';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ya2FlZXRhZHl6YmhiYXdyb3NmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MDI2NDMsImV4cCI6MjEwNTQ3ODY0M30.1DFHv3ZdEIFZjdoudi2RJayGo5qqUhfKne_47fengCU';
// ============================================

var sb = null;
try {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch(e) {
  document.getElementById('main').innerHTML = '<div class="loading" style="color:#e11d2e">Erro ao criar cliente Supabase: ' + e.message + '</div>';
}

var ESTADOS = ['Recebido', 'Em reparação', 'Pronto', 'Entregue'];
var userAtual = null;

// Deteção de erros
window.addEventListener('error', function(e) {
  var m = document.getElementById('main');
  if (m) m.innerHTML = '<div class="loading" style="color:#e11d2e;text-align:left;padding:20px">' +
    '<strong>Erro JavaScript:</strong><br>' + (e.message || 'desconhecido') +
    '<br><br><strong>Linha:</strong> ' + (e.lineno || '?') +
    '</div>';
});

// ===== CLIENTES =====
async function getClientes() {
  var r = await sb.from('clientes').select('*').order('nome');
  return r.data || [];
}
async function getCliente(id) {
  var r = await sb.from('clientes').select('*').eq('id', id).single();
  return r.data;
}
async function addCliente(c) {
  var r = await sb.from('clientes').insert(c).select().single();
  return r.data;
}
async function updateCliente(id, patch) {
  await sb.from('clientes').update(patch).eq('id', id);
}
async function removeCliente(id) {
  await sb.from('clientes').delete().eq('id', id);
}

// ===== OBRAS =====
async function getObras() {
  var r = await sb.from('obras').select('*').order('created_at', { ascending: false });
  return r.data || [];
}
async function getObra(id) {
  var r = await sb.from('obras').select('*').eq('id', id).single();
  return r.data;
}
async function addObra(o) {
  var r = await sb.from('obras').insert(o).select().single();
  return r.data;
}
async function updateObra(id, patch) {
  await sb.from('obras').update(patch).eq('id', id);
}
async function gerarNumero() {
  var ano = new Date().getFullYear();
  var r = await sb.from('obras').select('numero');
  var nums = (r.data || []).map(function(o){ return Number((o.numero||'').split('-')[2]); }).filter(function(n){ return !isNaN(n); });
  var prox = nums.length ? Math.max.apply(null, nums) + 1 : 1;
  return 'OT-' + ano + '-' + String(prox).padStart(4,'0');
}

// ===== FOTOS =====
async function getFotos(obraId, tipo) {
  var r = await sb.from('fotos').select('*').eq('obra_id', obraId).eq('tipo', tipo).order('created_at');
  return r.data || [];
}
async function addFoto(obraId, tipo, file) {
  var ext = file.name.split('.').pop();
  var path = obraId + '/' + tipo + '_' + Date.now() + '.' + ext;
  var up = await sb.storage.from('fotos').upload(path, file);
  if (up.error) { alert('Erro ao enviar foto: ' + up.error.message); return; }
  var url = sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
  await sb.from('fotos').insert({ obra_id: obraId, tipo: tipo, url: url });
}
async function removeFoto(id) {
  await sb.from('fotos').delete().eq('id', id);
}

// ===== HELPERS =====
function fmt(d) { if (!d) return '—'; var p = d.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function hoje() { return new Date().toISOString().slice(0,10); }

// ===== NAVEGAÇÃO =====
function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function nav(pagina, extra) {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  ['inicio','nova','pesquisar'].forEach(function(p) {
    var b = document.getElementById('bn-' + p);
    if (b) b.classList.toggle('ativo', p === pagina);
  });
  render(pagina, extra);
}
function render(pagina, extra) {
  var m = document.getElementById('main');
  m.innerHTML = '<div class="loading">A carregar...</div>';
  if (pagina === 'inicio') return renderInicio(m);
  if (pagina === 'nova') return renderNova(m);
  if (pagina === 'pesquisar') return renderPesquisar(m);
  if (pagina === 'clientes-lista') return renderClientesLista(m);
  if (pagina === 'clientes') return renderClientes(m);
  if (pagina === 'cliente-detalhe') return renderClienteDetalhe(m, extra);
  if (pagina === 'cliente-editar') return renderClienteEditar(m, extra);
  if (pagina === 'obra') return renderObra(m, extra);
  if (pagina === 'definicoes') return renderDefinicoes(m);
}

// ===== LOGIN =====
function renderLogin() {
  var m = document.getElementById('main');
  document.querySelector('.header').style.display = 'none';
  document.querySelector('.bottom-nav').style.display = 'none';
  m.innerHTML =
    '<div class="login">' +
      '<h1>3Volution<span>Turbos</span></h1>' +
      '<p class="muted small" style="text-align:center;margin-bottom:20px">Gestão de oficina</p>' +
      '<label>Email</label><input id="lg-email" type="email" placeholder="email">' +
      '<label>Password</label><input id="lg-pass" type="password" placeholder="password">' +
      '<div id="lg-erro" class="muted small" style="color:#e11d2e;text-align:center;min-height:18px"></div>' +
      '<button class="btn btn-primary" onclick="fazerLogin()">Entrar</button>' +
      '</div>';
}

async function fazerLogin() {
  var email = document.getElementById('lg-email').value.trim();
  var pass = document.getElementById('lg-pass').value;
  document.getElementById('lg-erro').textContent = 'A entrar...';
  try {
    var r = await sb.auth.signInWithPassword({ email: email, password: pass });
    if (r.error) {
      document.getElementById('lg-erro').textContent = 'Erro: ' + r.error.message;
      return;
    }
    userAtual = r.data.user;
    iniciarApp();
  } catch(e) {
    document.getElementById('lg-erro').textContent = 'Erro: ' + e.message;
  }
}

function iniciarApp() {
  document.querySelector('.header').style.display = 'flex';
  document.querySelector('.bottom-nav').style.display = 'grid';
  document.getElementById('drawer-email').textContent = userAtual.email;
  nav('inicio');
}

async function sair() {
  await sb.auth.signOut();
  userAtual = null;
  renderLogin();
}

// ===== INÍCIO =====
async function renderInicio(m) {
  var obras = await getObras();
  var h = hoje();
  var s = {
    recebidos: obras.filter(function(o){ return o.estado === 'Recebido'; }).length,
    reparacao: obras.filter(function(o){ return o.estado === 'Em reparação'; }).length,
    prontos: obras.filter(function(o){ return o.estado === 'Pronto'; }).length,
    entregues: obras.filter(function(o){ return o.estado === 'Entregue' && o.data_entrega === h; }).length
  };
  var recentes = obras.slice(0,3);
  m.innerHTML =
    '<div class="destaque">' +
      '<p class="tag">OFICINA</p>' +
      '<h2>Gestão de turbos</h2>' +
      '<span class="icone">🔧</span>' +
      '<p>Obras, clientes, fotografias e estado do trabalho num só local.</p>' +
    '</div>' +
    '<div class="grid2">' +
      '<div class="stat"><div class="num">' + s.recebidos + '</div><div class="lbl">Recebidos</div></div>' +
      '<div class="stat"><div class="num">' + s.reparacao + '</div><div class="lbl">Em reparação</div></div>' +
      '<div class="stat"><div class="num">' + s.prontos + '</div><div class="lbl">Prontos</div></div>' +
      '<div class="stat"><div class="num">' + s.entregues + '</div><div class="lbl">Entregues hoje</div></div>' +
    '</div>' +
    '<button class="btn btn-primary" onclick="nav(\'nova\')">📋 Nova folha de obra</button>' +
    '<button class="btn btn-sec" onclick="nav(\'pesquisar\')">🔍 Pesquisa rápida</button>' +
    '<div class="linha"><h3>Obras recentes</h3><a class="muted small" onclick="nav(\'clientes\')" style="cursor:pointer">Ver todas</a></div>' +
    (recentes.map(cardObra).join('') || '<p class="muted small" style="text-align:center;padding:20px">Sem obras.</p>');
}

function cardObra(o) {
  return '<div class="obra" onclick="nav(\'obra\',\'' + o.id + '\')">' +
    '<div class="top"><span class="num">' + o.numero + '</span>' +
    '<span class="badge ' + (o.estado||'').replace(/\s/g,'') + '">' + o.estado + '</span></div>' +
    '<div class="cliente">' + o.cliente_nome + '</div>' +
    '<div class="sub"><span>' + (o.categoria||'—') + '</span><span>' + fmt(o.data_recebido) + '</span></div>' +
    '</div>';
}

// ===== NOVA OBRA =====
async function renderNova(m) {
  var clientes = await getClientes();
  m.innerHTML =
    '<h2 style="margin-bottom:16px">Nova folha de obra</h2>' +
    '<label>Cliente *</label>' +
    '<div class="autocomplete">' +
      '<input id="f-cliente-busca" placeholder="Escreve para procurar..." oninput="procurarCliente(this.value)" onfocus="procurarCliente(this.value)" autocomplete="off">' +
      '<input type="hidden" id="f-cliente-id">' +
      '<div id="f-cliente-lista" class="autocomplete-list"></div>' +
    '</div>' +
    '<button class="btn btn-sec btn-pequeno" style="margin-bottom:16px" onclick="nav(\'cliente-editar\', \'novo\')">➕ Criar novo cliente</button>' +
    '<div class="grid-info">' +
      '<div><label>Telefone</label><input id="f-tel"></div>' +
      '<div><label>NIF</label><input id="f-nif"></div>' +
    '</div>' +
    '<label>Categoria</label><input id="f-cat" value="Reparações de Turbos">' +
    '<label>Veículo</label><input id="f-veic">' +
    '<div class="grid-info">' +
      '<div><label>Matrícula</label><input id="f-mat"></div>' +
      '<div><label>Motorização</label><input id="f-mot"></div>' +
    '</div>' +
    '<label>Ref. turbo</label><input id="f-ref">' +
    '<label>Notas</label><textarea id="f-notas" rows="3"></textarea>' +
    '<button class="btn btn-primary" onclick="guardarNova()">Criar obra</button>';
  window._clientesCache = clientes;
}

function procurarCliente(txt) {
  var lista = document.getElementById('f-cliente-lista');
  var clientes = (window._clientesCache || []).filter(function(c) {
    return !txt || c.nome.toLowerCase().indexOf(txt.toLowerCase()) !== -1 ||
      (c.telefone||'').indexOf(txt) !== -1 || (c.nif||'').indexOf(txt) !== -1;
  });
  if (clientes.length === 0) { lista.classList.remove('show'); return; }
  lista.innerHTML = clientes.map(function(c) {
    return '<div onclick="escolherCliente(\'' + c.id + '\')">' +
      '<strong>' + c.nome + '</strong>' +
      (c.telefone ? '<span class="muted small"> · ' + c.telefone + '</span>' : '') +
      '</div>';
  }).join('');
  lista.classList.add('show');
}

function escolherCliente(id) {
  var c = (window._clientesCache || []).find(function(x){ return x.id === id; });
  if (!c) return;
  document.getElementById('f-cliente-id').value = id;
  document.getElementById('f-cliente-busca').value = c.nome;
  document.getElementById('f-tel').value = c.telefone || '';
  document.getElementById('f-nif').value = c.nif || '';
  document.getElementById('f-cliente-lista').classList.remove('show');
}

async function guardarNova() {
  var clienteId = document.getElementById('f-cliente-id').value;
  var clienteNome = document.getElementById('f-cliente-busca').value.trim();
  if (!clienteNome) { alert('Escolhe ou cria um cliente'); return; }
  var numero = await gerarNumero();
  var nova = await addObra({
    numero: numero,
    cliente_id: clienteId || null,
    cliente_nome: clienteNome,
    cliente_telefone: document.getElementById('f-tel').value,
    cliente_nif: document.getElementById('f-nif').value,
    categoria: document.getElementById('f-cat').value,
    veiculo: document.getElementById('f-veic').value,
    matricula: document.getElementById('f-mat').value,
    motorizacao: document.getElementById('f-mot').value,
    ref_turbo: document.getElementById('f-ref').value,
    notas: document.getElementById('f-notas').value,
    estado: 'Recebido',
    data_recebido: hoje()
  });
  if (nova && nova.id) nav('obra', nova.id);
  else alert('Erro ao criar obra');
}

// ===== OBRA =====
async function renderObra(m, id) {
  var o = await getObra(id);
  if (!o) { m.innerHTML = '<p class="muted">Obra não encontrada.</p>'; return; }
  var antes = await getFotos(id, 'antes');
  var depois = await getFotos(id, 'depois');
  m.innerHTML =
    '<div class="cabecalho-obra">' +
      '<button class="voltar" onclick="nav(\'inicio\')">←</button>' +
      '<div style="flex:1"><div class="tag">FOLHA DE OBRA</div><div class="num">' + o.numero + '</div></div>' +
      '<span class="badge ' + (o.estado||'').replace(/\s/g,'') + '">' + o.estado + '</span>' +
    '</div>' +
    '<div class="card">' +
      '<div class="linha" style="margin-bottom:16px">' +
        '<h3 style="margin:0">' + o.cliente_nome + '</h3>' +
        (o.cliente_telefone ? '<a href="tel:' + o.cliente_telefone + '" class="voltar">📞</a>' : '') +
      '</div>' +
      '<div class="grid-info">' +
        campo('Telefone', o.cliente_telefone) +
        campo('NIF', o.cliente_nif) +
        campo('Categoria', o.categoria) +
        campo('Recebido', fmt(o.data_recebido)) +
        campo('Entregue', fmt(o.data_entrega)) +
        campo('Veículo', o.veiculo) +
        campo('Matrícula', o.matricula) +
        campo('Motorização', o.motorizacao) +
        campo('Ref. turbo', o.ref_turbo) +
      '</div>' +
      (o.notas ? '<div style="margin-top:12px"><div class="muted small">Notas</div><div style="margin-top:4px;white-space:pre-wrap">' + o.notas + '</div></div>' : '') +
      renderFotos(id, 'antes', antes) +
      renderFotos(id, 'depois', depois) +
    '</div>' +
    '<div class="card">' +
      '<h3 style="margin:0 0 8px">Estado da obra</h3>' +
      '<div class="estados">' +
        ESTADOS.map(function(e) { return '<button class="' + (o.estado===e?'ativo':'') + '" onclick="mudarEstado(\'' + id + '\',\'' + e + '\')">' + e + '</button>'; }).join('') +
      '</div>' +
    '</div>' +
    '<button class="btn btn-sec" onclick="editarObra(\'' + id + '\')">✏️ Editar obra</button>';
}

function campo(lbl, val) {
  return '<div class="campo-info"><div class="lbl">' + lbl + '</div><div class="val">' + (val || '—') + '</div></div>';
}

function renderFotos(obraId, tipo, fotos) {
  var html = '<div class="sub-titulo">' + (tipo === 'antes' ? '📷 Antes' : '📷 Depois') + '</div>';
  html += '<div class="fotos-grid">';
  fotos.forEach(function(f) {
    html += '<div class="foto-item">' +
      '<img src="' + f.url + '" onclick="window.open(\'' + f.url + '\',\'_blank\')">' +
      '<button class="remover" onclick="apagarFoto(\'' + f.id + '\',\'' + obraId + '\')">✕</button>' +
      '</div>';
  });
  html += '<label class="foto-add">' +
    '<input type="file" accept="image/*" class="foto-input" onchange="enviarFoto(event,\'' + obraId + '\',\'' + tipo + '\')">' +
    '<span style="font-size: 24px">+</span>' +
    '<span>Adicionar</span>' +
    '</label>';
  html += '</div>';
  return html;
}

async function enviarFoto(event, obraId, tipo) {
  var file = event.target.files[0];
  if (!file) return;
  var m = document.getElementById('main');
  m.innerHTML = '<div class="loading">A enviar foto...</div>';
  await addFoto(obraId, tipo, file);
  renderObra(m, obraId);
}

async function apagarFoto(id, obraId) {
  if (!confirm('Remover esta foto?')) return;
  await removeFoto(id);
  renderObra(document.getElementById('main'), obraId);
}

async function mudarEstado(id, estado) {
  var o = await getObra(id);
  var data_entrega = estado === 'Entregue' ? hoje() : o.data_entrega;
  await updateObra(id, { estado: estado, data_entrega: data_entrega });
  renderObra(document.getElementById('main'), id);
}

async function editarObra(id) {
  var o = await getObra(id);
  var m = document.getElementById('main');
  m.innerHTML =
    '<div class="cabecalho-obra">' +
      '<button class="voltar" onclick="nav(\'obra\',\'' + id + '\')">←</button>' +
      '<div><div class="tag">EDITAR</div><div class="num">' + o.numero + '</div></div>' +
    '</div>' +
    '<div class="card">' +
      '<label>Nome do cliente</label><input id="e-nome" value="' + (o.cliente_nome||'') + '">' +
      '<label>Telefone</label><input id="e-tel" value="' + (o.cliente_telefone||'') + '">' +
      '<label>NIF</label><input id="e-nif" value="' + (o.cliente_nif||'') + '">' +
      '<label>Categoria</label><input id="e-cat" value="' + (o.categoria||'') + '">' +
      '<label>Veículo</label><input id="e-veic" value="' + (o.veiculo||'') + '">' +
      '<label>Matrícula</label><input id="e-mat" value="' + (o.matricula||'') + '">' +
      '<label>Motorização</label><input id="e-mot" value="' + (o.motorizacao||'') + '">' +
      '<label>Ref. turbo</label><input id="e-ref" value="' + (o.ref_turbo||'') + '">' +
      '<label>Data de entrega</label><input id="e-data" type="date" value="' + (o.data_entrega||'') + '">' +
      '<label>Estado</label><select id="e-estado">' +
        ESTADOS.map(function(e) { return '<option ' + (o.estado===e?'selected':'') + '>' + e + '</option>'; }).join('') +
      '</select>' +
      '<label>Notas</label><textarea id="e-notas" rows="3">' + (o.notas||'') + '</textarea>' +
    '</div>' +
    '<div class="grid-info">' +
      '<button class="btn btn-sec" onclick="nav(\'obra\',\'' + id + '\')">Cancelar</button>' +
      '<button class="btn btn-primary" onclick="guardarEdicao(\'' + id + '\')">Guardar</button>' +
    '</div>';
}

async function guardarEdicao(id) {
  await updateObra(id, {
    cliente_nome: document.getElementById('e-nome').value,
    cliente_telefone: document.getElementById('e-tel').value,
    cliente_nif: document.getElementById('e-nif').value,
    categoria: document.getElementById('e-cat').value,
    veiculo: document.getElementById('e-veic').value,
    matricula: document.getElementById('e-mat').value,
    motorizacao: document.getElementById('e-mot').value,
    ref_turbo: document.getElementById('e-ref').value,
    data_entrega: document.getElementById('e-data').value || null,
    estado: document.getElementById('e-estado').value,
    notas: document.getElementById('e-notas').value
  });
  nav('obra', id);
}

// ===== PESQUISAR =====
async function renderPesquisar(m) {
  m.innerHTML =
    '<h2 style="margin-bottom:16px">Pesquisar</h2>' +
    '<div class="card">' +
      '<input id="p-busca" placeholder="Nº OT, cliente, telefone, matrícula..." oninput="filtrar()">' +
      '<div class="grid-info">' +
        '<select id="p-estado" onchange="filtrar()"><option value="">Todos os estados</option>' +
          ESTADOS.map(function(e) { return '<option>' + e + '</option>'; }).join('') +
        '</select>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
          '<input id="p-ini" type="date" onchange="filtrar()">' +
          '<input id="p-fim" type="date" onchange="filtrar()">' +
        '</div>' +
      '</div>' +
      '<button class="btn btn-sec" style="margin:0" onclick="limparFiltros()">Limpar filtros</button>' +
    '</div>' +
    '<p class="muted small" id="p-cont"></p>' +
    '<div id="p-lista"></div>';
  window._todasObras = await getObras();
  filtrar();
}

function filtrar() {
  var b = (document.getElementById('p-busca').value || '').toLowerCase();
  var e = document.getElementById('p-estado').value;
  var ini = document.getElementById('p-ini').value;
  var fim = document.getElementById('p-fim').value;
  var res = (window._todasObras || []).filter(function(o) {
    var mb = !b || o.numero.toLowerCase().indexOf(b) !== -1 || o.cliente_nome.toLowerCase().indexOf(b) !== -1 ||
      (o.cliente_telefone||'').indexOf(b) !== -1 || (o.matricula||'').toLowerCase().indexOf(b) !== -1 ||
      (o.veiculo||'').toLowerCase().indexOf(b) !== -1 || (o.ref_turbo||'').toLowerCase().indexOf(b) !== -1;
    var me = !e || o.estado === e;
    var mi = !ini || o.data_recebido >= ini;
    var mf = !fim || o.data_recebido <= fim;
    return mb && me && mi && mf;
  });
  document.getElementById('p-cont').textContent = res.length + ' resultado(s)';
  document.getElementById('p-lista').innerHTML = res.map(cardObra).join('') || '<p class="muted small" style="text-align:center;padding:20px">Nada encontrado.</p>';
}

function limparFiltros() {
  document.getElementById('p-busca').value = '';
  document.getElementById('p-estado').value = '';
  document.getElementById('p-ini').value = '';
  document.getElementById('p-fim').value = '';
  filtrar();
}

// ===== CLIENTES (LISTA) =====
async function renderClientesLista(m) {
  var clientes = await getClientes();
  m.innerHTML =
    '<div class="linha" style="margin-bottom:16px">' +
      '<h2>Clientes</h2>' +
      '<button class="btn btn-primary btn-pequeno" onclick="nav(\'cliente-editar\', \'novo\')">➕ Novo</button>' +
    '</div>' +
    '<input placeholder="Filtrar por nome..." oninput="filtrarClientesLista(this.value)">' +
    '<div id="cli-lista">' + clientes.map(cardCliente).join('') + '</div>';
  window._clientesCache2 = clientes;
}

function cardCliente(c) {
  return '<div class="cliente-card" onclick="nav(\'cliente-detalhe\',\'' + c.id + '\')">' +
    '<div class="linha"><strong>' + c.nome + '</strong></div>' +
    (c.telefone ? '<div class="muted small" style="margin-top:4px">📞 ' + c.telefone + '</div>' : '') +
    (c.email ? '<div class="muted small">✉️ ' + c.email + '</div>' : '') +
    (c.nif ? '<div class="muted small">NIF: ' + c.nif + '</div>' : '') +
    (c.rua ? '<div class="muted small">📍 ' + c.rua + (c.codigo_postal ? ', ' + c.codigo_postal : '') + (c.localidade ? ' ' + c.localidade : '') + '</div>' : '') +
    '</div>';
}

function filtrarClientesLista(txt) {
  var clientes = (window._clientesCache2 || []).filter(function(c) {
    return c.nome.toLowerCase().indexOf(txt.toLowerCase()) !== -1 ||
      (c.telefone||'').indexOf(txt) !== -1 || (c.nif||'').indexOf(txt) !== -1 ||
      (c.email||'').toLowerCase().indexOf(txt.toLowerCase()) !== -1;
  });
  document.getElementById('cli-lista').innerHTML = clientes.map(cardCliente).join('') || '<p class="muted small" style="text-align:center;padding:20px">Nada encontrado.</p>';
}

async function renderClienteDetalhe(m, id) {
  var c = await getCliente(id);
  if (!c) { m.innerHTML = '<p class="muted">Cliente não encontrado.</p>'; return; }
  var obras = await getObras();
  var minhasObras = obras.filter(function(o){ return o.cliente_id === id; });
  m.innerHTML =
    '<div class="cabecalho-obra">' +
      '<button class="voltar" onclick="nav(\'clientes-lista\')">←</button>' +
      '<div style="flex:1"><div class="tag">CLIENTE</div><div class="num">' + c.nome + '</div></div>' +
    '</div>' +
    '<div class="card">' +
      (c.telefone ? '<div class="campo-info"><div class="lbl">Telefone</div><div class="val"><a href="tel:' + c.telefone + '" style="color:#e11d2e;text-decoration:none">' + c.telefone + '</a></div></div>' : '') +
      (c.email ? '<div class="campo-info"><div class="lbl">Email</div><div class="val">' + c.email + '</div></div>' : '') +
      (c.nif ? '<div class="campo-info"><div class="lbl">NIF</div><div class="val">' + c.nif + '</div></div>' : '') +
      (c.rua ? '<div class="campo-info"><div class="lbl">Morada</div><div class="val">' + c.rua + (c.codigo_postal ? '<br>' + c.codigo_postal : '') + (c.localidade ? '<br>' + c.localidade : '') + '</div></div>' : '') +
      (c.notas ? '<div class="campo-info"><div class="lbl">Notas</div><div class="val">' + c.notas + '</div></div>' : '') +
    '</div>' +
    '<div class="grid-info" style="margin-bottom:16px">' +
      '<button class="btn btn-sec" onclick="nav(\'cliente-editar\',\'' + id + '\')">✏️ Editar</button>' +
      '<button class="btn btn-primary" onclick="nav(\'nova\')">➕ Nova obra</button>' +
    '</div>' +
    '<h3>Obras (' + minhasObras.length + ')</h3>' +
    (minhasObras.map(cardObra).join('') || '<p class="muted small" style="text-align:center;padding:20px">Sem obras.</p>');
}

async function renderClienteEditar(m, id) {
  var c = id === 'novo' ? { nome:'', telefone:'', email:'', nif:'', rua:'', codigo_postal:'', localidade:'', notas:'' } : await getCliente(id);
  if (!c) { m.innerHTML = '<p class="muted">Cliente não encontrado.</p>'; return; }
  m.innerHTML =
    '<div class="cabecalho-obra">' +
      '<button class="voltar" onclick="nav(\'clientes-lista\')">←</button>' +
      '<div><div class="tag">' + (id === 'novo' ? 'NOVO CLIENTE' : 'EDITAR CLIENTE') + '</div></div>' +
    '</div>' +
    '<div class="card">' +
      '<label>Nome *</label><input id="c-nome" value="' + (c.nome||'') + '">' +
      '<label>Telefone</label><input id="c-tel" value="' + (c.telefone||'') + '">' +
      '<label>Email</label><input id="c-email" type="email" value="' + (c.email||'') + '">' +
      '<label>NIF</label><input id="c-nif" value="' + (c.nif||'') + '">' +
      '<label>Rua / Morada</label><input id="c-rua" value="' + (c.rua||'') + '">' +
      '<div class="grid-info">' +
        '<div><label>Código Postal</label><input id="c-cp" value="' + (c.codigo_postal||'') + '"></div>' +
        '<div><label>Localidade</label><input id="c-loc" value="' + (c.localidade||'') + '"></div>' +
      '</div>' +
      '<label>Notas</label><textarea id="c-notas" rows="3">' + (c.notas||'') + '</textarea>' +
    '</div>' +
    '<div class="grid-info">' +
      '<button class="btn btn-sec" onclick="nav(\'clientes-lista\')">Cancelar</button>' +
      '<button class="btn btn-primary" onclick="guardarCliente(\'' + id + '\')">Guardar</button>' +
    '</div>' +
    (id !== 'novo' ? '<button class="btn btn-sec" style="color:#e11d2e;margin-top:12px" onclick="apagarCliente(\'' + id + '\')">🗑️ Apagar cliente</button>' : '');
}

async function guardarCliente(id) {
  var nome = document.getElementById('c-nome').value.trim();
  if (!nome) { alert('Nome é obrigatório'); return; }
  var dados = {
    nome: nome,
    telefone: document.getElementById('c-tel').value,
    email: document.getElementById('c-email').value,
    nif: document.getElementById('c-nif').value,
    rua: document.getElementById('c-rua').value,
    codigo_postal: document.getElementById('c-cp').value,
    localidade: document.getElementById('c-loc').value,
    notas: document.getElementById('c-notas').value
  };
  if (id === 'novo') await addCliente(dados);
  else await updateCliente(id, dados);
  nav('clientes-lista');
}

async function apagarCliente(id) {
  if (!confirm('Apagar este cliente? As obras associadas não são apagadas.')) return;
  await removeCliente(id);
  nav('clientes-lista');
}

// ===== CLIENTES / OBRAS =====
async function renderClientes(m) {
  var obras = await getObras();
  var grupos = {};
  obras.forEach(function(o) { (grupos[o.cliente_nome] = grupos[o.cliente_nome] || []).push(o); });
  var clientes = Object.keys(grupos).sort();
  m.innerHTML =
    '<h2 style="margin-bottom:16px">Clientes / Obras</h2>' +
    '<input placeholder="Filtrar por cliente..." oninput="filtrarClientes(this.value)">' +
    '<div id="c-lista">' + clientes.map(function(c) {
      return '<div style="margin-top:16px">' +
        '<div class="linha"><strong>' + c + '</strong><span class="muted small">' + grupos[c].length + ' obra(s)</span></div>' +
        '<div style="margin-top:8px">' + grupos[c].map(cardObra).join('') + '</div></div>';
    }).join('') + '</div>';
  window._gruposCache = grupos;
}

function filtrarClientes(txt) {
  var grupos = window._gruposCache || {};
  var filtrados = {};
  Object.keys(grupos).forEach(function(k) {
    if (k.toLowerCase().indexOf(txt.toLowerCase()) !== -1) filtrados[k] = grupos[k];
  });
  var clientes = Object.keys(filtrados).sort();
  document.getElementById('c-lista').innerHTML = clientes.map(function(c) {
    return '<div style="margin-top:16px">' +
      '<div class="linha"><strong>' + c + '</strong><span class="muted small">' + filtrados[c].length + ' obra(s)</span></div>' +
      '<div style="margin-top:8px">' + filtrados[c].map(cardObra).join('') + '</div></div>';
  }).join('') || '<p class="muted small" style="text-align:center;padding:20px">Nada encontrado.</p>';
}

// ===== DEFINIÇÕES =====
async function renderDefinicoes(m) {
  m.innerHTML =
    '<h2 style="margin-bottom:16px">Definições</h2>' +
    '<div class="card">' +
      '<div class="muted small">Email da conta</div>' +
      '<div style="font-weight:600;margin-bottom:12px">' + (userAtual ? userAtual.email : '—') + '</div>' +
    '</div>' +
    '<h3>Mudar password</h3>' +
    '<div class="card">' +
      '<label>Nova password</label><input id="d-pass" type="password" placeholder="mínimo 6 caracteres">' +
      '<label>Confirmar password</label><input id="d-pass2" type="password">' +
      '<div id="d-msg" class="muted small" style="min-height:18px"></div>' +
      '<button class="btn btn-primary" onclick="mudarPassword()">Guardar nova password</button>' +
    '</div>';
}

async function mudarPassword() {
  var p1 = document.getElementById('d-pass').value;
  var p2 = document.getElementById('d-pass2').value;
  var msg = document.getElementById('d-msg');
  if (p1.length < 6) { msg.style.color = '#e11d2e'; msg.textContent = 'A password tem de ter pelo menos 6 caracteres'; return; }
  if (p1 !== p2) { msg.style.color = '#e11d2e'; msg.textContent = 'As passwords não coincidem'; return; }
  msg.style.color = '#9ca3af'; msg.textContent = 'A alterar...';
  var r = await sb.auth.updateUser({ password: p1 });
  if (r.error) { msg.style.color = '#e11d2e'; msg.textContent = 'Erro: ' + r.error.message; return; }
  msg.style.color = '#86efac'; msg.textContent = 'Password alterada com sucesso!';
}

// ===== ARRANQUE =====
window.addEventListener('DOMContentLoaded', function() {
  if (typeof supabase === 'undefined') {
    document.getElementById('main').innerHTML = '<div class="loading" style="color:#e11d2e">ERRO: Biblioteca Supabase não carregou. Verifica a ligação à internet.</div>';
    return;
  }
  if (!sb) return;
  sb.auth.getSession().then(function(r) {
    if (r.data.session && r.data.session.user) {
      userAtual = r.data.session.user;
      iniciarApp();
    } else {
      renderLogin();
    }
  }).catch(function(e) {
    document.getElementById('main').innerHTML = '<div class="loading" style="color:#e11d2e">Erro auth: ' + e.message + '</div>';
  });
});
</script>
