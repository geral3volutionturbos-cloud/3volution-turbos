function fmt(d) { if (!d) return '—'; var p = d.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function hoje() { return new Date().toISOString().slice(0,10); }
function fmtMoeda(v) { if (v === null || v === undefined || v === '') return '—'; return Number(v).toFixed(2).replace('.', ',') + ' €'; }

function estadoPagamento(o) {
  var total = Number(o.valor_total || 0);
  var pago = Number(o.valor_pago || 0);
  var falta = total - pago;
  if (total === 0) return { classe: 'divida', texto: '—' };
  if (pago >= total) return { classe: 'pago', texto: '✅ Pago (' + fmtMoeda(total) + ')' };
  if (pago > 0) return { classe: 'parcial', texto: '🟡 Parcial · Falta ' + fmtMoeda(falta) };
  return { classe: 'divida', texto: '💰 Em dívida · ' + fmtMoeda(falta) };
}

// ===== CLIENTES =====
async function getClientes() {

// ===== OBRAS =====
async function getObras() {
  var todas = [];
  var offset = 0;
  var limite = 1000;
  while (true) {
    var r = await sb.from('obras').select('*').order('created_at', { ascending: false }).range(offset, offset + limite - 1);
    if (!r.data || r.data.length === 0) break;
    todas = todas.concat(r.data);
    if (r.data.length < limite) break;
    offset += limite;
  }
  return todas;
}
async function getObra(id) {
  var r = await sb.from('obras').select('*').eq('id', id).single();
  return r.data;
}
async function addObra(o) {
  var r = await sb.from('obras').insert(o).select().single();
  return r.data;
}
async function updateObra(id, patch) {
  await sb.from('obras').update(patch).eq('id', id);
}
async function removeObra(id) {
  await sb.from('obras').delete().eq('id', id);
}
async function gerarNumero() {
  var ano = new Date().getFullYear();
  var r = await sb.from('obras').select('numero');
  var nums = (r.data || []).map(function(o){ return Number((o.numero||'').split('-')[2]); }).filter(function(n){ return !isNaN(n); });
  var prox = nums.length ? Math.max.apply(null, nums) + 1 : 1;
  return 'OT-' + ano + '-' + String(prox).padStart(4,'0');
}

  return r.data || [];
}

async function comprimirImagem(file, maxLargura, qualidade) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement('canvas');
        var w = img.width;
        var h = img.height;
        if (w > maxLargura) { h = Math.round(h * maxLargura / w); w = maxLargura; }
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(blob) {
          if (!blob) { reject(new Error('Erro a comprimir')); return; }
          resolve(blob);
        }, 'image/jpeg', qualidade);
      };
      img.onerror = function() { reject(new Error('Erro a ler imagem')); };
      img.src = e.target.result;
    };
    reader.onerror = function() { reject(new Error('Erro a ler ficheiro')); };
    reader.readAsDataURL(file);
  });
}

async function addFoto(obraId, tipo, file) {
  var blob;
  try { blob = await comprimirImagem(file, 1920, 0.85); } catch(e) { alert('Erro a comprimir: ' + e.message); return; }
  var nomeFicheiro = 'foto_' + Date.now() + '.jpg';
  var resp = await fetch(SUPABASE_URL + '/functions/v1/quick-worker', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY },
    body: JSON.stringify({ fileName: nomeFicheiro, contentType: 'image/jpeg' })
  });
  var json = await resp.json();
  if (json.error) { alert('Erro ao preparar upload: ' + json.error); return; }
  var up = await fetch(json.uploadUrl, { method: 'PUT', body: blob, headers: { 'Content-Type': 'image/jpeg' } });
  if (!up.ok) { alert('Erro no upload: ' + up.status); return; }
  var publicUrl = R2_PUBLIC_URL + '/' + json.key;
  await sb.from('fotos').insert({ obra_id: obraId, tipo: tipo, url: publicUrl });
}

async function removeFoto(id) {
  await sb.from('fotos').delete().eq('id', id);

function nav(pagina, extra) {
  if (pagina !== 'obra') {
    paginaAnterior = pagina;
  }
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  ['inicio','nova','pesquisar'].forEach(function(p) {
    var b = document.getElementById('bn-' + p);
    if (b) b.classList.toggle('ativo', p === pagina);
  });
  render(pagina, extra);
}
function render(pagina, extra) {
  var m = document.getElementById('main');
  m.innerHTML = '<div class="loading">A carregar...</div>';
  if (pagina === 'inicio') return renderInicio(m);
  if (pagina === 'nova') return renderNova(m);
  if (pagina === 'pesquisar') return renderPesquisar(m);
  if (pagina === 'clientes-lista') return renderClientesLista(m);
  if (pagina === 'clientes') return renderClientes(m);
  if (pagina === 'cliente-detalhe') return renderClienteDetalhe(m, extra);

    '<div class="top"><span class="num">' + o.numero + '</span>' +
    '<span class="badge ' + (o.estado||'').replace(/\s/g,'') + '">' + o.estado + '</span></div>' +
    '<div class="cliente">' + o.cliente_nome + '</div>' +
    '<div class="sub"><span>' + (o.categoria||'—') + '</span><span>' + fmt(o.data_recebido) + '</span></div>' +

}
