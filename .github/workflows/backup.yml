name: Backup da Base de Dados

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          
      - name: Fazer Backup
        run: |
          export PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}"
          # ATENÇÃO: Substitui o HOST abaixo pelo host que copiaste do Supabase (Direct Connection)
          pg_dump -h db.jxexagghrhjxqdbbxcwl.supabase.co -p 5432 -U postgres -d postgres --schema-only --no-owner --no-privileges > schema.sql
          pg_dump -h db.jxexagghrhjxqdbbxcwl.supabase.co -p 5432 -U postgres -d postgres --data-only > data.sql
          
      - name: Guardar Ficheiros no GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Backup automático da base de dados
          file_pattern: '*.sql'
