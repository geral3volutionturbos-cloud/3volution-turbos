name: Backup da Base de Dados

on:
  schedule:
    - cron: '0 0 * * *' # Corre todos os dias à meia-noite
  workflow_dispatch: # Permite correr manualmente

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          
      - name: Fazer Backup
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump --schema-only --no-owner --no-privileges --dbname="$DB_URL" > schema.sql
          pg_dump --data-only --dbname="$DB_URL" > data.sql
          
      - name: Guardar Ficheiros no GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Backup automático da base de dados
          file_pattern: '*.sql'
