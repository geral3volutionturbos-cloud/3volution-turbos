name: Backup da Base de Dados

on:
  schedule:
    - cron: '0 0 * * *' # Corre todos os dias à meia-noite (UTC)
  workflow_dispatch: # Permite correr manualmente no separador Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      supabase_db_url: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: supabase/setup-cli@v1
        with:
          version: 2.104.0
          
      - name: Backup roles
        run: supabase db dump --db-url "$supabase_db_url" -f roles.sql --role-only
        
      - name: Backup schema
        run: supabase db dump --db-url "$supabase_db_url" -f schema.sql
        
      - name: Backup data
        run: supabase db dump --db-url "$supabase_db_url" -f data.sql --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"
        
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Backup automático da base de dados
          file_pattern: '*.sql'
